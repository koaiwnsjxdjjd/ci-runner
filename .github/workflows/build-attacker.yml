name: Build Attacker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pycryptodome

      - name: Decrypt source
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        run: |
          python3 -c "
          import os, io, tarfile
          from Crypto.Cipher import AES
          key = bytes.fromhex(os.environ['DECRYPT_KEY'])
          with open('app.enc', 'rb') as f: data = f.read()
          nonce, tag, ct = data[:12], data[-16:], data[12:-16]
          plain = AES.new(key, AES.MODE_GCM, nonce=nonce).decrypt_and_verify(ct, tag)
          with tarfile.open(fileobj=io.BytesIO(plain), mode='r:gz') as tar: tar.extractall('.')
          print('Decrypted OK')
          "

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build attacker
        run: |
          cd attacker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o attacker attacker.go
          chmod +x attacker
          ls -la attacker

      - name: Upload to Releases
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd attacker
          RESP=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/qqztceghrgji/demo-vps/releases/tags/attacker")
          REL_ID=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
          if [ -z "$REL_ID" ]; then
            RESP=$(curl -s -X POST -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"tag_name":"attacker","name":"CI artifacts","body":"automated build cache"}' \
              "https://api.github.com/repos/qqztceghrgji/demo-vps/releases")
            REL_ID=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
          fi
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/qqztceghrgji/demo-vps/releases/tags/attacker" | \
            python3 -c "import json,sys; [print(a['id']) for a in json.load(sys.stdin).get('assets',[]) if a['name']=='attacker']" | \
            while read AID; do
              curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/qqztceghrgji/demo-vps/releases/assets/$AID"
            done
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @attacker \
            "https://uploads.github.com/repos/qqztceghrgji/demo-vps/releases/$REL_ID/assets?name=attacker"
          echo "Upload done"
